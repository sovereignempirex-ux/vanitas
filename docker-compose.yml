services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vanitas
      POSTGRES_USER: vanitas
      # Single source of truth for the DB password: POSTGRES_PASSWORD in .env.
      # Production: POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set a strong password}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-dev-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./supabase/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vanitas -d vanitas"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama

  vanitas:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file: .env
    environment:
      NODE_ENV: production
      AI_PROVIDER: ollama
      OLLAMA_BASE_URL: http://ollama:11434
      # Derived from POSTGRES_PASSWORD so the app can never drift from the
      # password Postgres was initialised with (env_file's localhost URL is
      # for `npm run dev` outside Docker; this entry overrides it in-container).
      DATABASE_URL: postgresql://vanitas:${POSTGRES_PASSWORD:-change-me-dev-only}@postgres:5432/vanitas
      # Set ADMIN_API_TOKEN / FRONTEND_URL in .env (never commit .env)
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started

volumes:
  postgres_data:
  ollama_models:
