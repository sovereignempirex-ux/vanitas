services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vanitas
      POSTGRES_USER: vanitas
      # Override in production: POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set a strong password}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-dev-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./supabase/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vanitas -d vanitas"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama

  vanitas:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file: .env
    environment:
      NODE_ENV: production
      AI_PROVIDER: ollama
      OLLAMA_BASE_URL: http://ollama:11434
      # Set DATABASE_URL / ADMIN_API_TOKEN / FRONTEND_URL in .env (never commit .env)
      DATABASE_URL: ${DATABASE_URL:-postgresql://vanitas:change-me-dev-only@postgres:5432/vanitas}
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started

volumes:
  postgres_data:
  ollama_models:
