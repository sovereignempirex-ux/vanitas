# Foundry configuration — `contracts/`
#
# Deliberately dependency-free: no `lib/`, no OpenZeppelin. EIP-712 and ECDSA
# recovery are implemented in the contract itself so that `forge build` and
# `forge test` never reach for the network (beyond solc's one-time fetch) and
# CI needs no keys, no submodules and no `forge install`.

[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]

# Pinned so a Foundry upgrade cannot silently change the generated bytecode —
# the whole point of a credit ledger is that it is auditable and reproducible.
solc_version = "0.8.30"
auto_detect_solc = false

optimizer = true
optimizer_runs = 200

# PUSH0 needs paris+; cancun is what the major testnets and mainnet are on.
evm_version = "cancun"

# `forge test` runs on an in-process EVM — no RPC, no node, no keys.
# See README.md for why this matters for rule 2 of REBUILD_PLAN.md.

[lint]
# `require-revert-in-loop` is reported because `executeBatch` calls
# `_execute`, which reverts. Both halves of the finding are wrong *here*:
#
#   * The loop is bounded by calldata length and therefore by the block gas
#     limit — there is no unbounded iteration, which is the DoS the lint
#     exists to catch. `executeBatch` never loops over stored state.
#   * An all-or-nothing revert is the documented intent: a partially applied
#     billing run is worse than a failed one, so the batch must be atomic.
#
# Suppressed project-wide rather than on eleven separate lines, because the
# eleven lines are one decision and repeating it would bury it. Every other
# lint stays on — including `reentrancy-events` and `block-timestamp`, which
# are silenced inline at their three and one sites respectively, where the
# reason for each is written where a reader will meet it.
exclude_lints = ["require-revert-in-loop"]

[fmt]
# Wide enough that the three single-line `emit`s carrying a
# `disable-next-line(reentrancy-events)` suppression stay under the limit —
# a formatter wrap would break the suppression silently. See src/VanitasCredit.sol.
line_length = 120
tab_width = 4
bracket_spacing = false
