[pytest]
asyncio_mode = auto
testpaths = tests
# `app/` is a package sitting next to this file, not an installed one. Running
# `pytest` (the console script) does NOT put the cwd on sys.path the way
# `python -m pytest` does, so the conftest's `from app...` import dies with
# ModuleNotFoundError and pytest exits 4 (USAGE_ERROR) before collecting a
# single test. Declaring the root here makes either invocation work.
pythonpath = .
filterwarnings =
    ignore::DeprecationWarning
